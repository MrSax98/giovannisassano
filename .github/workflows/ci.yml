name: CI

# Quality gate on every push and pull request. Deployment itself is done by
# Vercel's GitHub integration (preview per PR, production on main).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://giovannisassano.vercel.app' }}
      - name: Upload static export
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: out
          retention-days: 7
